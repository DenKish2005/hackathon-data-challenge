<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta name="theme-color" content="#0f1210" />
    <meta
      name="description"
      content="Freedom Broker — аналитика качества клиентских диалогов"
    />
    <link rel="icon" type="image/png" href="./freedom-logo.png" />
    <title>Freedom · Контроль качества</title>
  </head>
  <body style="background: #0f1210">
    <div id="root">
      <section
        id="boot-screen"
        style="
          max-width: 540px;
          margin: 14vh auto;
          padding: 32px;
          font:
            16px/1.6 system-ui,
            sans-serif;
          color: #e9f3ec;
          background: #171f19;
          border: 1px solid #304837;
          border-radius: 12px;
        "
      >
        <strong style="color: #0dcd62">FREEDOM · КОНТРОЛЬ КАЧЕСТВА</strong>
        <h1 id="boot-title" style="font-size: 26px; line-height: 1.3">
          Открываем рабочее пространство…
        </h1>
        <p id="boot-help">Загружаем интерфейс и критерии оценки.</p>
        <p id="boot-instructions" hidden>
          Откройте терминал в папке frontend, выполните <code>npm ci</code>,
          затем <code>npm run dev</code> и откройте адрес Local из терминала. В
          опубликованной версии попробуйте обновить страницу.
        </p>
        <noscript
          >Для работы интерфейса включите JavaScript в браузере.</noscript
        >
      </section>
    </div>
    <script>
      (() => {
        const explain = () => {
          if (!document.getElementById("boot-screen")) return;
          document.getElementById("boot-title").textContent =
            "Не удалось загрузить приложение";
          document.getElementById("boot-help").textContent =
            location.protocol === "file:"
              ? "Вы открыли исходный HTML-файл. Для запуска нужен локальный сервер."
              : "Файлы интерфейса не загрузились. Проверьте соединение и обновите страницу.";
          document.getElementById("boot-instructions").hidden = false;
          document.getElementById("boot-screen").setAttribute("role", "alert");
        };
        if (location.protocol === "file:") explain();
        else setTimeout(explain, 4000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
