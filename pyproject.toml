[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenops-guard"
version = "0.1.0"
description = "Atomic run-scoped AI spending control with Redis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["sqlalchemy>=2.0,<3", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "redis>=5.2,<7", "pydantic>=2.10,<3", "PyYAML>=6,<7", "openai>=2.54,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1", "ruff>=0.11,<1", "build>=1,<2"]

[project.scripts]
tokenops-demo = "tokenops_guard.demo:main"
cqa = "cqa.__main__:main"
cqa-backend = "cqa.backend.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tokenops_guard = ["ledger/scripts/*.lua"]
cqa = ["checklist.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
