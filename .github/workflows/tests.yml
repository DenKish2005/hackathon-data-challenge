name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests examples scripts/run-cqa.py
      - run: ruff format --check src tests examples scripts/run-cqa.py
      - run: pytest -q
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6379/15
      - run: tokenops-demo --scenario all
        env:
          REDIS_URL: redis://127.0.0.1:6379/0
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      BASE_URL: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Select installed Chromium
        run: |
          node --input-type=module <<'JS'
          import { chromium } from '@playwright/test';
          import { appendFileSync } from 'node:fs';
          appendFileSync(process.env.GITHUB_ENV, `CHROMIUM_PATH=${chromium.executablePath()}\n`);
          JS
      - name: Start production preview
        run: |
          npm run preview -- --port 4173 > /tmp/cqa-preview.log 2>&1 &
          curl --fail --retry 20 --retry-connrefused --retry-delay 1 "$BASE_URL/" > /dev/null
      - run: node tests/smoke.mjs
      - run: node tests/evaluation.mjs
      - run: node tests/reliability.mjs
      - run: node --test ../tests/vercel_proxy.test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the real backend for browser integration
        working-directory: .
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e .
      - run: node tests/backend-flow.mjs
